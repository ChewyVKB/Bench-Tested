    <text x="396" y="144" font-size="12" fill="#7a8494">Serial 28J173402708 · /dev/usb/lp2</text>
    <g font-size="12.5">
      <text x="396" y="176" fill="#7a8494">Label size:</text><text x="490" y="176" fill="#1b2533">4.00 x 6.00 in (812 x 1218 dots)</text>
      <text x="740" y="176" fill="#7a8494">Resolution:</text><text x="830" y="176" fill="#1b2533">203 dpi</text>
      <text x="396" y="198" fill="#7a8494">Head usage:</text><text x="490" y="198" fill="#1b2533">32,258 IN</text>
      <text x="740" y="198" fill="#7a8494">Firmware:</text><text x="830" y="198" fill="#1b2533">V61.17.17Z</text>
    </g>
    <line x1="396" y1="214" x2="1020" y2="214" stroke="#e3e7ec"/>
    <g font-size="13">
      <text x="396" y="246" fill="#2b3442">Before printing:</text><rect x="540" y="230" width="330" height="26" rx="5" fill="#fff" stroke="#cfd6df"/><text x="552" y="248" fill="#1b2533">Factory reset (recommended before selling)  ▾</text>
      <text x="396" y="282" fill="#2b3442">Label size:</text><rect x="540" y="266" width="330" height="26" rx="5" fill="#fff" stroke="#cfd6df"/><text x="552" y="284" fill="#1b2533">Auto-detect  ▾</text>
      <text x="396" y="318" fill="#2b3442">Resolution:</text><rect x="540" y="302" width="330" height="26" rx="5" fill="#fff" stroke="#cfd6df"/><text x="552" y="320" fill="#1b2533">Auto  ▾</text>
    </g>
    <rect x="396" y="346" width="624" height="44" rx="8" fill="#2f80ed"/><text x="708" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Print test label</text>
    <g font-size="12.5" fill="#2b3442">
      <rect x="396" y="402" width="148" height="32" rx="6" fill="#fff" stroke="#cfd6df"/><text x="470" y="423" text-anchor="middle">Printer info</text>
      <rect x="554" y="402" width="148" height="32" rx="6" fill="#fff" stroke="#cfd6df"/><text x="628" y="423" text-anchor="middle">Config label</text>
      <rect x="712" y="402" width="148" height="32" rx="6" fill="#fff" stroke="#cfd6df"/><text x="786" y="423" text-anchor="middle">Factory reset</text>
      <rect x="870" y="402" width="150" height="32" rx="6" fill="#fff" stroke="#cfd6df"/><text x="945" y="423" text-anchor="middle">Calibrate</text>
    </g>

    <!-- bottom: activity -->
    <rect x="52" y="536" width="976" height="172" rx="8" fill="#fbfcfd" stroke="#dde2e9"/>
    <text x="66" y="556" font-size="12" font-weight="700" fill="#7a8494">Activity</text>
    <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b3442">
      <text x="66" y="582">09:30:12  [GK420d …2708] Restoring factory settings… the printer will feed a couple of labels.</text>
      <text x="66" y="602">09:30:31  [GK420d …2708] Detected 4.00 x 6.00 in at 203 dpi.</text>
      <text x="66" y="622">09:30:32  [GK420d …2708] Sent full-size test label.</text>
      <text x="66" y="642">09:31:05  [Symbol Bar Code Scanner] scanned: BT-128-OK  -&gt;  Code 128 ✓</text>
      <text x="66" y="662">09:31:40  [PowerMicII-NS] buttons connected (and trackball)</text>
      <text x="66" y="682">09:31:52  [PowerMicII-NS] Recorded. Peak level -14 dB - the mic picked up sound ✓</text>
    </g>

    <!-- callouts -->
    <g font-size="15" font-weight="700" fill="#fff">
      <circle cx="1080" cy="58" r="16" fill="#eb5757"/><text x="1080" y="64" text-anchor="middle">1</text>
      <circle cx="1080" cy="300" r="16" fill="#eb5757"/><text x="1080" y="306" text-anchor="middle">3</text>
      <circle cx="1080" cy="620" r="16" fill="#eb5757"/><text x="1080" y="626" text-anchor="middle">4</text>
      <circle cx="20" cy="300" r="16" fill="#eb5757"/><text x="20" y="306" text-anchor="middle">2</text>
    </g>
    <g stroke="#eb5757" stroke-width="2" stroke-dasharray="4 4">
      <line x1="1064" y1="58" x2="1040" y2="58"/><line x1="1064" y1="300" x2="1040" y2="300"/><line x1="1064" y1="620" x2="1028" y2="620"/><line x1="36" y1="300" x2="52" y2="300"/>
    </g>
    <g font-size="13" fill="#2b3442" font-weight="700">
      <text x="1102" y="54">Toolbar</text>
      <text x="1102" y="296">Device</text><text x="1102" y="312">page</text>
      <text x="1102" y="616">Activity</text><text x="1102" y="632">log</text>
    </g>
