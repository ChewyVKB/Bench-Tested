<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="14" fill="#eef1f5"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- window -->
    <rect x="40" y="30" width="1000" height="690" rx="12" fill="#ffffff" stroke="#c9d0da"/>
    <!-- header bar -->
    <path d="M40 42 a12 12 0 0 1 12 -12 h976 a12 12 0 0 1 12 12 v42 h-1000z" fill="#f3f5f8"/>
    <line x1="40" y1="84" x2="1040" y2="84" stroke="#dde2e9"/>
    <rect x="58" y="44" width="148" height="28" rx="6" fill="#fff" stroke="#cfd6df"/><text x="132" y="63" text-anchor="middle" font-size="13" fill="#2b3442">Clean up printers…</text>
    <rect x="214" y="44" width="182" height="28" rx="6" fill="#fff" stroke="#cfd6df"/><text x="305" y="63" text-anchor="middle" font-size="13" fill="#2b3442">System printer settings</text>
    <text x="540" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2533">Bench Tested</text>
    <text x="540" y="74" text-anchor="middle" font-size="11" fill="#7a8494">Plug in a device to test it</text>
    <circle cx="950" cy="58" r="13" fill="#fff" stroke="#cfd6df"/><path d="M944 58 a6 6 0 1 0 6 -6 m0 0 l-3 -3 m3 3 l-3 3" fill="none" stroke="#2b3442" stroke-width="1.6"/>
    <circle cx="1012" cy="58" r="8" fill="#e5e8ed"/>

    <!-- left: device list -->
    <rect x="40" y="84" width="330" height="440" fill="#fbfcfd"/>
    <line x1="370" y1="84" x2="370" y2="524" stroke="#dde2e9"/>
