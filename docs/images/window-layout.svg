    <text x="90" y="186" font-size="11" fill="#7a8494">SN 28J173402708 · /dev/usb/lp2</text>
    <text x="90" y="200" font-size="11" fill="#27ae60">✓ Done 09:31</text>
    <rect x="52" y="210" width="306" height="50" rx="8" fill="#fff" stroke="#e3e7ec"/>
    <rect x="64" y="228" width="14" height="14" rx="3" fill="#fff" stroke="#9aa4b2"/>
    <text x="90" y="231" font-size="13" font-weight="700" fill="#1b2533">DYMO LabelWriter 450 Turbo</text>
    <text x="90" y="248" font-size="11" fill="#7a8494">SN 16082918113221</text>
    <text x="58" y="284" font-size="10.5" font-weight="700" fill="#8a94a3" letter-spacing="1">BARCODE SCANNERS</text>
    <rect x="52" y="292" width="306" height="50" rx="8" fill="#fff" stroke="#e3e7ec"/>
    <text x="90" y="313" font-size="13" font-weight="700" fill="#1b2533">Symbol Bar Code Scanner</text>
    <text x="90" y="330" font-size="11" fill="#27ae60">✓ 6 scans · 1D 4/4  2D 2/3</text>
    <text x="58" y="366" font-size="10.5" font-weight="700" fill="#8a94a3" letter-spacing="1">DICTATION MICS</text>
    <rect x="52" y="374" width="306" height="50" rx="8" fill="#fff" stroke="#e3e7ec"/>
    <text x="90" y="395" font-size="13" font-weight="700" fill="#1b2533">Nuance PowerMicII-NS</text>
    <text x="90" y="412" font-size="11" fill="#27ae60">mic ✓ · speaker ✓ · 10 buttons ✓</text>
    <rect x="52" y="440" width="140" height="32" rx="6" fill="#fff" stroke="#cfd6df"/><text x="122" y="461" text-anchor="middle" font-size="12" fill="#2b3442">Tick all printers</text>
